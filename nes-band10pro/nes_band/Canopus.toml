schema = 1

[module]
id = "nes_band"
version = "0.1.0"
version_code = 1
kind = "target"
language = "rust"
lifecycle = "resident-after-activation"
canopus_abi = "2"
description = "NES emulator (x-nes) that renders the 256x240 picture on the Band 10 Pro display"

[build]
sources = ["Cargo.toml"]

[targets]
include = ["xiaomi-band-10-pro-3.101.043"]

[capabilities]
required = [
  "identity-guard",
  "native-app.register",
  "launcher.entry",
  "ui.dispatch",
]

[native_app]
enabled = true
app_id = "nes_band"
name = "NES"
entry = "canopus_module_descriptor"
role = "standalone"

[resources]
files = ["assets/appicon_nes.bin"]
